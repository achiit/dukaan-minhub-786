<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINHUB — A World Through My Lens</title>
<meta name="description" content="MINHUB, the photography journal of Minhaj Ahmed, Assam, India.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@300;400;500&display=swap">
<style>
:root{--bg:#F5F2EB;--fg:#111;--mut:#6d655a;--acc:#C9BBA7;--card:#fff;--ln:rgba(17,17,17,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111;--fg:#F5F2EB;--mut:#a79d8e;--card:#171717;--ln:rgba(245,242,235,.16);color-scheme:dark}}
:root[data-theme=dark]{--bg:#111;--fg:#F5F2EB;--mut:#a79d8e;--card:#171717;--ln:rgba(245,242,235,.16);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--bg);overscroll-behavior-y:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:300 15px/1.7 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;margin:0;line-height:1.05}
h2{font-size:clamp(2.2rem,6vw,4rem)}a{color:inherit}img{max-width:100%;display:block}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 5vw 18px;mix-blend-mode:normal;transition:.4s}
header.s{background:var(--bg)}
.logo{letter-spacing:.45em;font-weight:500;text-decoration:none;font-size:14px}
nav{display:flex;gap:28px;align-items:center}nav a,nav button{font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;background:none;border:0;color:inherit;cursor:pointer;opacity:.75;padding:4px 0}
nav a:hover,nav a.on{opacity:1;border-bottom:1px solid var(--acc)}
#burger{display:none}
@media(max-width:760px){#burger{display:block;background:none;border:0;color:inherit;font-size:11px;letter-spacing:.2em}nav{position:fixed;inset:0;background:var(--bg);flex-direction:column;justify-content:center;gap:26px;opacity:0;visibility:hidden;z-index:25;transition:opacity .4s,visibility .4s}nav.o{opacity:1;visibility:visible}nav a{font:300 2rem 'Cormorant Garamond',serif;text-transform:none;letter-spacing:.05em}}
header>.logo,header>#burger{position:relative;z-index:30}
.hero{height:100svh;min-height:560px;position:relative;display:grid;place-items:center;text-align:center;color:#F5F2EB;overflow:hidden;background:#111 center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0008,#000a)}
.hero>div{position:relative;z-index:2;padding:0 6vw;animation:up 1.4s both}
.hero h1{font-size:clamp(3.2rem,14vw,9rem);letter-spacing:.3em;margin-right:-.3em;font-weight:300}
.hero em{display:block;font:italic 300 clamp(1.3rem,3vw,2rem) 'Cormorant Garamond',serif;color:var(--acc);margin:10px 0 18px}
.hero p{max-width:460px;margin:0 auto 30px;opacity:.85}
.btn{display:inline-block;border:1px solid currentColor;padding:12px 26px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;background:none;color:inherit;cursor:pointer;margin:5px;transition:.3s;font-family:inherit}
.btn:hover,.btn.f{background:var(--acc);border-color:var(--acc);color:#111}
.scroll{position:absolute;bottom:26px;left:50%;width:1px;height:50px;background:linear-gradient(#F5F2EB,transparent);z-index:2;animation:sc 2s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
section{padding:110px 5vw 60px;max-width:1400px;margin:auto}
.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0;align-items:center}
.chip{border:1px solid var(--ln);background:none;color:inherit;padding:6px 14px;font:inherit;font-size:11px;letter-spacing:.12em;cursor:pointer}.chip.on{background:var(--fg);color:var(--bg)}
input,select,textarea{background:transparent;border:0;border-bottom:1px solid var(--ln);color:inherit;font:inherit;padding:10px 0;width:100%;outline:0;transition:.3s}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}select option{color:#111}
.bar input,.bar select{width:auto;min-width:150px}
.mas{columns:3 280px;column-gap:18px}
.ph{break-inside:avoid;margin-bottom:18px;position:relative;overflow:hidden;cursor:zoom-in;animation:up .8s both}
.ph img{width:100%;height:auto;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}.ph:hover img{transform:scale(1.05)}
.ph .cap{position:absolute;inset:auto 0 0;padding:40px 14px 12px;background:linear-gradient(transparent,#000b);color:#F5F2EB;opacity:0;transition:.4s;font-size:12px;letter-spacing:.08em}
.ph:hover .cap,.ph:focus-within .cap{opacity:1}.ph h3{font-size:1.4rem;color:#fff}
.fav{position:absolute;top:8px;right:8px;background:#0006;border:0;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}.fav.on{color:#e8b4a0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px}
.col{cursor:pointer}.col .im{aspect-ratio:4/5;overflow:hidden;background:var(--card)}.col img{width:100%;height:100%;object-fit:cover;transition:1.2s}.col:hover img{transform:scale(1.05)}
.col h3{font-size:1.8rem;margin-top:12px}.col p{color:var(--mut);margin:4px 0}
.lb{position:fixed;inset:0;background:#0c0c0cf2;z-index:50;display:none;color:#F5F2EB;grid-template-rows:1fr auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}.lb.o{display:grid}
.lb .st{display:grid;place-items:center;padding:60px 6vw 10px;min-height:0}.lb img{max-height:100%;max-width:100%;object-fit:contain}
.lb .inf{padding:10px 6vw 26px;text-align:center}.lb h3{font-size:2rem}.lb small{color:var(--acc);letter-spacing:.15em;text-transform:uppercase;font-size:11px}
.lb button{position:absolute;background:none;border:0;color:#F5F2EB;font-size:28px;cursor:pointer;padding:14px}.lb .x{top:calc(8px + env(safe-area-inset-top,0px));right:10px}.lb .pv{left:6px;top:45%}.lb .nx{right:6px;top:45%}
.lb .sh{font-size:11px;letter-spacing:.2em;text-transform:uppercase;position:static;border:1px solid #fff5;margin:10px 4px 0;padding:8px 16px}
.about{display:grid;grid-template-columns:1fr 1.2fr;gap:6vw;align-items:center}.about img{width:100%;aspect-ratio:4/5;object-fit:cover}.about p{white-space:pre-line;color:var(--mut)}
@media(max-width:760px){.about{grid-template-columns:1fr}}
.form{display:grid;gap:18px;max-width:560px;margin-top:30px}.ci a{display:block;text-decoration:none;margin:4px 0}
.ok{padding:30px;border:1px solid var(--acc);text-align:center;font:italic 1.6rem 'Cormorant Garamond',serif}
footer{border-top:1px solid var(--ln);padding:60px 5vw 40px;margin-top:80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;font-size:13px;color:var(--mut)}
footer a{display:block;text-decoration:none;margin:3px 0}footer .logo{color:var(--fg)}.cp{grid-column:1/-1;font-size:11px;letter-spacing:.1em}
.ad{background:var(--card);border:1px solid var(--ln);padding:22px;margin:18px 0;display:grid;gap:12px}
.ad h3{font-size:1.7rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
.mini{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--ln);padding:8px 0}.mini img{width:54px;height:54px;object-fit:cover}.mini span{flex:1}
.mini button,.sm{font-size:11px;padding:5px 10px;border:1px solid var(--ln);background:none;color:inherit;cursor:pointer}
#top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--fg);cursor:pointer;opacity:0;pointer-events:none;transition:.3s}#top.v{opacity:1;pointer-events:auto}
.ld{position:fixed;inset:0;background:var(--bg);z-index:99;display:grid;place-items:center;letter-spacing:.5em;transition:opacity .8s}.ld.h{opacity:0;pointer-events:none}
.nf{min-height:80vh;display:grid;place-items:center;text-align:center}.nf h2{font-size:9rem}
.note{color:var(--mut);font-size:12px;border-left:2px solid var(--acc);padding-left:10px;margin:14px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="ld" id="ld">MINHUB</div>
<header id="hd"><a class="logo" href="#home">MINHUB</a><button id="burger" aria-label="Menu">MENU</button>
<nav id="nv"><a href="#home">Home</a><a href="#gallery">Gallery</a><a href="#collections">Collections</a><a href="#journal">Journal</a><a href="#about">About</a><a href="#contact">Contact</a><a href="#admin" id="adl" hidden>Admin</a><button id="th" aria-label="Toggle theme">◐</button></nav></header>
<main id="app"></main>
<footer id="ft"></footer>
<button id="top" aria-label="Back to top">↑</button>
<div class="lb" id="lb" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button><button class="pv" aria-label="Previous">‹</button><button class="nx" aria-label="Next">›</button><div class="st"><img id="li" alt=""></div><div class="inf" id="lf"></div></div>
<script>
const CATS=["Nature & Landscapes","Portraits","Street Photography","Travel & Exploration","Architecture","Wildlife","Everyday Moments","Artistic Photography","Special Memories"];
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=(a,b,c,w,h)=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/><circle cx="${w*.7}" cy="${h*.3}" r="${w*.08}" fill="#fff" opacity=".35"/><path d="M0 ${h*.72}Q${w*.3} ${h*.5} ${w*.55} ${h*.68}T${w} ${h*.6}V${h}H0Z" fill="${c}" opacity=".8"/><path d="M0 ${h*.85}Q${w*.4} ${h*.7} ${w} ${h*.82}V${h}H0Z" fill="#111" opacity=".5"/></svg>`);
const SP=[["Morning Mist","#e9c9a0","#8a7f9a","#2c3a4a",800,1000,0,"Misty ridges at first light."],["Brahmaputra Dusk","#f0a870","#b5586a","#2a2a40",1000,700,0,"Evening river glow."],["Quiet Lane","#cfd6c8","#7d9482","#243b30",800,1100,2,"A road after rain."],["Golden Hour","#f6d98a","#d98a4a","#4a2c2a",1000,800,6,"Everyday light."],["Stone & Sky","#c9d3dc","#7b8794","#222a33",800,900,4,"Lines and shadows."],["Tea Garden","#d8e6b8","#6f9a5a","#1f3a2a",1000,750,0,"Rows of green."],["Window Light","#efe3d0","#b89f84","#3a2f27",800,1050,1,"A portrait in soft light."],["Night Bazaar","#6a5a8a","#3a2f5a","#14121f",1000,800,2,"Street after dark."]].map((s,i)=>({id:"s"+i,title:s[0],url:svg(s[1],s[2],s[3],s[4],s[5]),cat:CATS[s[6]],cap:s[7],loc:"Assam, India",date:`2026-0${i%9+1}-1${i%9}`,feat:i<3,fav:false,sample:1}));
const DS={heroT:"MINHUB",heroS:"A World Through My Lens.",heroP:"Every photograph holds a story. Every moment deserves to be remembered.",heroImg:"",name:"Minhaj Ahmed",loc:"Noorpur, Sootea, Biswanath, Assam, India.",phone:"9707241030",email:"zenroahmed@gmail.com",
bio:"Hello, I'm Minhaj Ahmed. Welcome to my little corner of the internet, where I collect moments, explore perspectives, and tell stories through photography.\n\nFor me, photography is more than capturing an image. It's about preserving emotions, appreciating beauty, and finding extraordinary details in ordinary moments.\n\nMINHUB is my personal visual journal — a place where my photographs and memories come together.",
interests:"Landscapes · Portraits · Street · Travel · Everyday moments",profile:"",social:"",footer:"Created with creativity by Minhaj Ahmed.",notice:""};
let S={photos:[],cols:[],posts:[],site:{}},db=null,user=null,assets=null,admin=false,F={q:"",cat:"",sort:"new",fav:false},LB={list:[],i:0};
const site=()=>({...DS,...S.site});
const P=()=>S.photos.length?S.photos:SP;
const favs=()=>{try{return JSON.parse(localStorage.mhFav||"[]")}catch{return[]}};
const tf=id=>{let f=favs();f=f.includes(id)?f.filter(x=>x!=id):[...f,id];try{localStorage.mhFav=JSON.stringify(f)}catch{}render()};
function grid(l){return `<div class="mas">${l.map((p,i)=>`<figure class="ph" style="margin:0 0 18px;animation-delay:${Math.min(i,8)*70}ms" data-i="${i}" tabindex="0"><img loading="lazy" decoding="async" src="${E(p.url)}" alt="${E(p.title)}"><figcaption class="cap"><h3>${E(p.title)}</h3>${E(p.cat||"")}</figcaption><button class="fav ${favs().includes(p.id)?"on":""}" data-f="${p.id}" aria-label="Favourite">♥</button></figure>`).join("")}</div>`}
function filtered(){let l=[...P()];if(F.q)l=l.filter(p=>(p.title||"").toLowerCase().includes(F.q.toLowerCase()));if(F.cat)l=l.filter(p=>p.cat==F.cat);if(F.fav)l=l.filter(p=>favs().includes(p.id));l.sort((a,b)=>(F.sort=="new"?-1:1)*String(a.date||"").localeCompare(String(b.date||"")));return l}
const V={
home(){const s=site(),f=P().filter(p=>p.feat).slice(0,6);return `<div class="hero" style="${s.heroImg?`background-image:url(${E(s.heroImg)})`:`background-image:url('${svg("#e8b98a","#6a5a7a","#14161f",1600,1000)}')`}"><div><h1>${E(s.heroT)}</h1><em>${E(s.heroS)}</em><p>${E(s.heroP)}</p><a class="btn f" href="#gallery">Explore Gallery</a><a class="btn" href="#about">Discover My Story</a></div><span class="scroll"></span></div>${s.notice?`<section style="padding-bottom:0"><div class="note">${E(s.notice)}</div></section>`:""}<section><div class="eyebrow">Featured</div><h2>Selected Frames</h2><div style="height:30px"></div>${grid(f)}</section>`},
gallery(){const l=filtered();LB.list=l;return `<section><div class="eyebrow">Gallery</div><h2>The Collection</h2><div class="bar"><input id="q" placeholder="Search by title" value="${E(F.q)}" aria-label="Search"><select id="so"><option value="new">Newest</option><option value="old" ${F.sort=="old"?"selected":""}>Oldest</option></select><button class="chip ${F.fav?"on":""}" id="fv">♥ Favourites</button></div><div class="bar" style="margin-top:-10px"><button class="chip ${F.cat?"":"on"}" data-c="">All</button>${CATS.map(c=>`<button class="chip ${F.cat==c?"on":""}" data-c="${E(c)}">${E(c)}</button>`).join("")}</div>${l.length?grid(l):'<p class="note">No photographs match.</p>'}${S.photos.length?"":'<p class="note">Showing sample artwork. Upload your own from the Admin panel.</p>'}</section>`},
collections(a){if(a){const c=S.cols.find(x=>x.id==a);if(!c)return V.nf();const l=P().filter(p=>(c.photos||[]).includes(p.id));LB.list=l;return `<section><a href="#collections" class="eyebrow">← Collections</a><h2>${E(c.name)}</h2><p style="max-width:560px;color:var(--mut)">${E(c.desc)}</p><div style="height:30px"></div>${grid(l)}</section>`}
const l=S.cols.length?S.cols:["Memories of Assam","Nature Diaries","Travel Stories"].map((n,i)=>({id:"x"+i,name:n,desc:"A sample collection.",cover:P()[i].url,photos:[],sample:1}));
return `<section><div class="eyebrow">Collections</div><h2>Visual Stories</h2><div style="height:30px"></div><div class="grid">${l.map(c=>`<div class="col" ${c.sample?"":`data-col="${c.id}"`}><div class="im"><img loading="lazy" src="${E(c.cover||P().find(p=>(c.photos||[])[0]==p.id)?.url||P()[0].url)}" alt=""></div><h3>${E(c.name)}</h3><p>${E(c.desc)}</p></div>`).join("")}</div></section>`},
journal(){return `<section><div class="eyebrow">Journal</div><h2>Stories &amp; Notes</h2><div style="height:30px"></div>${S.posts.length?S.posts.map(p=>`<article style="max-width:680px;margin-bottom:60px"><div class="eyebrow">${E(p.date)}</div><h3 style="font-size:2.4rem">${E(p.title)}</h3><p style="white-space:pre-line">${E(p.body)}</p></article>`).join(""):'<p class="note">No stories yet. Write the first one from the Admin panel.</p>'}</section>`},
about(){const s=site();return `<section><div class="about"><img src="${E(s.profile||svg("#d9c7ad","#8a7560","#2b2520",800,1000))}" alt="${E(s.name)}"><div><div class="eyebrow">About</div><h2>${E(s.name)}</h2><p class="eyebrow" style="margin-top:16px">${E(s.loc)}</p><p>${E(s.bio)}</p><div class="eyebrow" style="margin-top:24px">Interests</div><p>${E(s.interests)}</p></div></div></section>`},
contact(){const s=site();return `<section><div class="eyebrow">Contact</div><h2>LET'S CONNECT</h2><p style="max-width:520px;color:var(--mut)">Have a question, collaboration idea, or simply want to say hello? I'd love to hear from you.</p><div class="ci" style="margin:24px 0"><strong>${E(s.name)}</strong><span>${E(s.loc)}</span><a href="tel:${E(s.phone)}">${E(s.phone)}</a><a href="mailto:${E(s.email)}">${E(s.email)}</a></div><div id="cf"><form class="form" id="cfm"><input name="n" placeholder="Name" required><input name="e" type="email" placeholder="Email" required><input name="s" placeholder="Subject" required><textarea name="m" rows="4" placeholder="Message" required></textarea><button class="btn" style="justify-self:start">Send Message</button></form></div></section>`},
nf(){return `<div class="nf"><div><h2>404</h2><p>This frame is out of view.</p><a class="btn" href="#home">Return Home</a></div></div>`},
admin(){if(!admin)return `<section><h2>Admin</h2><p class="note">Private area. Only the owner of this page can manage it — open the page while signed in to claude.ai as the owner.</p></section>`;const s=site(),ph=S.photos;
return `<section><div class="eyebrow">Dashboard</div><h2>Studio</h2>
<div class="ad"><h3>Upload photographs</h3><div class="row"><input type="file" id="up" accept="image/*" multiple><select id="uc">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="ul" placeholder="Location"><input id="ud" type="date"></div><button class="btn" id="ub">Upload selected</button><div id="us"></div></div>
<div class="ad"><h3>Photographs (${ph.length})</h3>${ph.map(p=>`<div class="mini"><img src="${E(p.url)}" alt=""><span><b>${E(p.title)}</b><br><small>${E(p.cat)} · ${E(p.date)}</small></span><button data-ft="${p.id}">${p.feat?"★":"☆"} Feature</button><button data-ed="${p.id}">Edit</button><button data-dp="${p.id}">Delete</button></div>`).join("")||'<p class="note">None yet.</p>'}</div>
<div class="ad"><h3>Collections</h3><div class="row"><input id="cn" placeholder="Name"><input id="cd" placeholder="Description"><button class="btn" id="cb">Create</button></div>${S.cols.map(c=>`<div class="mini"><span><b>${E(c.name)}</b><br><small>${(c.photos||[]).length} photos</small></span><button data-ce="${c.id}">Edit</button><button data-cp="${c.id}">Photos</button><button data-cc="${c.id}">Cover</button><button data-dc="${c.id}">Delete</button></div>`).join("")}</div>
<div class="ad"><h3>Website</h3><form id="sf" class="ad" style="border:0;padding:0">${[["heroT","Hero heading"],["heroS","Hero subtitle"],["heroP","Hero text"],["name","Name"],["loc","Location"],["phone","Phone"],["email","Email"],["interests","Interests"],["social","Social links (one URL per line)"],["footer","Footer text"],["notice","Announcement"]].map(([k,l])=>`<label class="eyebrow">${l}<input name="${k}" value="${E(s[k])}"></label>`).join("")}<label class="eyebrow">Biography<textarea name="bio" rows="6">${E(s.bio)}</textarea></label><div class="row"><button class="btn" type="submit">Save website</button><button class="btn" type="button" id="hb">Change hero image</button><button class="btn" type="button" id="pb">Change profile photo</button></div></form></div>
<div class="ad"><h3>Write a story</h3><input id="pt" placeholder="Title"><textarea id="pb2" rows="5" placeholder="Story"></textarea><button class="btn" id="pst">Publish</button>${S.posts.map(p=>`<div class="mini"><span>${E(p.title)}</span><button data-dpo="${p.id}">Delete</button></div>`).join("")}</div>
<div class="ad"><h3>Messages</h3>${(S.msgs||[]).map(m=>`<div class="mini"><span><b>${E(m.s)}</b> — ${E(m.n)} (${E(m.e)})<br>${E(m.m)}</span></div>`).join("")||'<p class="note">No messages.</p>'}</div></section>`}};
function render(){const h=(location.hash||"#home").slice(1).split("/"),r=h[0];const f=V[r]&&r!="nf"?V[r]:V.nf;$("#app").innerHTML=f(h[1]);document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+r));
const s=site(),so=(s.social||"").split("\n").filter(x=>/^https?:/.test(x.trim()));
$("#ft").innerHTML=`<div><a class="logo" href="#home">MINHUB</a><p><em>A World Through My Lens.</em></p><p>${E(s.footer)}<br>Location: Assam, India.</p></div><div><a href="#gallery">Gallery</a><a href="#collections">Collections</a><a href="#about">About</a><a href="#contact">Contact</a></div><div><a href="tel:${E(s.phone)}">${E(s.phone)}</a><a href="mailto:${E(s.email)}">${E(s.email)}</a>${so.map(u=>`<a href="${E(u.trim())}" target="_blank" rel="noopener">${E(new URL(u.trim()).hostname.replace("www.",""))} ↗</a>`).join("")}</div><div class="cp">© 2026 MINHUB. All Rights Reserved.</div>`;
